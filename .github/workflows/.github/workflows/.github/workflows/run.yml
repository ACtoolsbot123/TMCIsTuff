name: Run Auto Refracher
on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest  # Windows has GUI support
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install customtkinter requests
      
      - name: Run Auto Refracher
        run: python "Auto Refracher.py"
      
      - name: Upload token
        uses: actions/upload-artifact@v2
        with:
          name: tokens
          path: e.txt
